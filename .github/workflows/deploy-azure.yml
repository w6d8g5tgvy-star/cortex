name: Deploy to Azure

# Deploys Cortex to Azure App Service on every release (release.json changes on main) or by hand.
# Needs repository VARIABLES (not secrets) from infra/setup-azure.sh: AZURE_CLIENT_ID, AZURE_TENANT_ID,
# AZURE_SUBSCRIPTION_ID, AZURE_WEBAPP_NAME. Without them the workflow does nothing.
on:
  push:
    branches: [main]
    paths: [release.json]
  workflow_dispatch:

permissions:
  id-token: write   # GitHub → Azure sign-in with a short-lived token (OIDC)
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Quick tests (the full suite runs before every release)
        run: node test/smoke.js && node test/azure.js

      - name: Package (Cortex has no npm dependencies)
        run: zip -qr cortex.zip bin src public package.json release.json README.md LICENSE

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: cortex.zip

      - name: Check it's up
        run: |
          url="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/healthz"
          for i in $(seq 1 30); do
            if curl -fsS "$url"; then echo; echo "Cortex is up."; exit 0; fi
            sleep 10
          done
          echo "Cortex didn't answer at $url"; exit 1
